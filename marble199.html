<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marble Game - The Final Hint</title>
    <link rel="stylesheet" type="text/css" href="static/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: url('static/images/s-l1200.jpg') no-repeat center center/cover;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            
        }
        #timer-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 2rem;
            position: fixed;
            top: 20px;
            right: 20px;
        }
        #winner-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 2rem;
            position: relative;
        }
        .foo {
            color: transparent;
            font-size: 0px;
        }
    </style>
</head>
<!-- This is to get it a change somwehrwe else-->
<body>

    <!-- Global Timer (This stays constant across pages) -->
    <div id="timer-box">Time Left: <span id="countdown">10:00</span></div>

    <div id="winner-box"> <!-- You can’t even trust your best friend in this game. in these games, your only friend is yourself… Look within -->
        You're almost there... but sometimes, style is more than just looks
        <span id="hidden-path" class="hidden-text"></span> 
    </div>

    <!--Next Path: /marble5.html -->

    <script>
        // 🔥 JavaScript inserts the hidden path dynamically (not in HTML source)
        window.onload = function () {
            document.getElementById("hidden-path");
        };
        
        // 🔥 Keeps the timer consistent across all pages
        function updateTimer() {
            let endTime = localStorage.getItem("endTime");

            if (!endTime) {
                let now = Date.now();
                endTime = now + 600 * 1000; // 10 minutes in milliseconds
                localStorage.setItem("endTime", endTime);
            }

            function refreshTimer() {
                let remaining = Math.floor((endTime - Date.now()) / 1000);
                if (remaining <= 0) {
                    document.getElementById('countdown').textContent = "Time's up!";
                    localStorage.removeItem("endTime");
                    window.location.href = "game-over.html";
                    return;
                }

                let minutes = Math.floor(remaining / 60);
                let seconds = remaining % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                document.getElementById('countdown').textContent = `${minutes}:${seconds}`;

                requestAnimationFrame(refreshTimer);
            }

            refreshTimer();
        }

        updateTimer();
    </script>

</body>
</html>
